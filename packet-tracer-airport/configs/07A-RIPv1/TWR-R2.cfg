hostname TWR-R2
no ip domain-lookup
interface FastEthernet0/0
 description Baggage and Tower LAN
 ip address 192.168.30.1 255.255.255.0
 no shutdown
 exit
interface Serial2/0
 description WAN to Terminal
 ip address 172.16.0.2 255.255.255.252
 no shutdown
 exit
interface Serial3/0
 description WAN to ISP
 ip address 172.16.0.5 255.255.255.252
 clock rate 64000
 no shutdown
 exit
router rip
 version 1
 auto-summary
 network 192.168.30.0
 network 172.16.0.0
 exit
end
