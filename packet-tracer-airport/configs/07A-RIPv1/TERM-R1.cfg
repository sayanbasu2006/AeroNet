hostname TERM-R1
no ip domain-lookup
interface FastEthernet0/0
 description Check-in LAN
 ip address 192.168.10.1 255.255.255.0
 no shutdown
 exit
interface FastEthernet1/0
 description Security LAN
 ip address 192.168.20.1 255.255.255.0
 no shutdown
 exit
interface Serial2/0
 description WAN to Control Tower
 ip address 172.16.0.1 255.255.255.252
 clock rate 64000
 no shutdown
 exit
router rip
 version 1
 auto-summary
 network 192.168.10.0
 network 192.168.20.0
 network 172.16.0.0
 exit
end
