hostname TERM-R1
no ip domain-lookup
interface FastEthernet0/0
 description Check-in LAN
 ip address 10.10.10.1 255.255.255.224
 ip nat inside
 no shutdown
 exit
interface FastEthernet1/0
 description Security LAN
 ip address 10.10.20.1 255.255.255.224
 ip nat inside
 no shutdown
 exit
interface Serial2/0
 description WAN to Control Tower
 ip address 172.16.0.1 255.255.255.252
 clock rate 64000
 ip nat outside
 no shutdown
 exit
ip route 0.0.0.0 0.0.0.0 172.16.0.2
access-list 1 permit 10.10.0.0 0.0.255.255
ip nat inside source list 1 interface Serial2/0 overload
end
