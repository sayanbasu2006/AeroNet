hostname TWR-R2
no ip domain-lookup
interface FastEthernet0/0
 description Baggage and Tower LAN
 ip address 10.20.10.1 255.255.255.224
 no shutdown
 exit
interface Serial2/0
 description WAN to Terminal
 ip address 172.16.0.2 255.255.255.252
 no shutdown
 exit
interface Serial3/0
 description WAN to ISP
 ip address 172.16.0.5 255.255.255.252
 clock rate 64000
 no shutdown
 exit
router ospf 1
 router-id 2.2.2.2
 network 10.20.10.0 0.0.0.31 area 2
 network 172.16.0.0 0.0.0.3 area 0
 network 172.16.0.4 0.0.0.3 area 0
 exit
end
