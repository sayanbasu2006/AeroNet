hostname TERM-R1
no ip domain-lookup
interface FastEthernet0/0
 description Check-in LAN
 ip address 10.10.10.1 255.255.255.224
 no shutdown
 exit
interface FastEthernet1/0
 description Security LAN
 ip address 10.10.20.1 255.255.255.224
 no shutdown
 exit
interface Serial2/0
 description WAN to Control Tower
 ip address 172.16.0.1 255.255.255.252
 clock rate 64000
 no shutdown
 exit
router ospf 1
 router-id 1.1.1.1
 network 10.10.10.0 0.0.0.31 area 0
 network 10.10.20.0 0.0.0.31 area 0
 network 172.16.0.0 0.0.0.3 area 0
 exit
end
