hostname ISP-R3
no ip domain-lookup
interface FastEthernet0/0
 description Flight API external LAN
 ip address 203.0.113.1 255.255.255.224
 no shutdown
 exit
interface Serial2/0
 description WAN to Tower
 ip address 172.16.0.6 255.255.255.252
 no shutdown
 exit
router ospf 1
 router-id 3.3.3.3
 network 203.0.113.0 0.0.0.31 area 0
 network 172.16.0.4 0.0.0.3 area 0
 exit
end
